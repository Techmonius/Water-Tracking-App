name: Validate Water Tracker

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run repository validation
        run: node scripts/validate.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder for validation
        run: python -m pip install 'Pillow>=11,<13'
      - name: Decode production plant artwork
        run: python scripts/validate-images.py
