name: Diagnose plant assets
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          for family in ('sunflower','monstera'):
              print('FAMILY',family)
              for suffix in 'abc':
                  p=Path(f'v1/js/{family}-assets-{suffix}.js')
                  if not p.exists(): continue
                  text=p.read_text()
                  pairs=re.findall(r"(?:S\.)?(stage\d+|flower\d+)[\"']?\s*(?:=|:)\s*[\"']data:image/png;base64,([^\"']+)",text)
                  for key,payload in pairs:
                      raw=''.join(payload.split())
                      try:
                          padded=raw + '='*((-len(raw))%4)
                          data=base64.b64decode(padded,validate=True)
                          ok=data.startswith(b'\x89PNG\r\n\x1a\n')
                          print(p.name,key,'chars',len(raw),'mod',len(raw)%4,'decoded',len(data),'png',ok)
                      except Exception as e:
                          print(p.name,key,'chars',len(raw),'mod',len(raw)%4,'ERROR',repr(e))
          PY
